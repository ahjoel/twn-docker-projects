#Issue of this config, no volume, data is gone when we restart
services:
  # Image tag will pull from our nexus repository 164.92.192.39:8083
  my-app:
    image: 164.92.192.39:8083/my-app:1.0
    ports:
      - 3000:3000
  mongodb:
    image: mongo
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
  mongo-express:
    image: techworldwithnana/mongo-express
    ports:
      - 8081:8081
    restart: always
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://admin:password@mongodb:27017
      - ME_CONFIG_BASICAUTH_USERNAME=user
      - ME_CONFIG_BASICAUTH_PASSWORD=pass