<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile</title>
<style>
    :root {
        --bg: #f4f5f7;
        --card: #ffffff;
        --text: #1d2330;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --accent-soft: #eef2ff;
        --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
    }
    * {
        box-sizing: border-box;
    }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
    }
    .container {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
    }
    .cover {
        height: 96px;
        background: linear-gradient(135deg, var(--accent), #06b6d4);
    }
    .content {
        padding: 0 28px 28px;
        text-align: center;
    }
    img {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid var(--card);
        margin-top: -60px;
        background: var(--border);
        display: inline-block;
    }
    h1 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 12px 0 20px;
    }
    .fields {
        text-align: left;
        border-top: 1px solid var(--border);
    }
    .field {
        padding: 14px 0;
        border-bottom: 1px solid var(--border);
    }
    .field span,
    .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-bottom: 4px;
    }
    .field h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 500;
        word-break: break-word;
    }
    .field input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        font-size: 15px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
    }
    .button {
        flex: 1;
        height: 44px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        transition: background 0.15s;
    }
    .button:hover {
        background: var(--accent-hover);
    }
    .button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
    }
    .button.secondary:hover {
        background: var(--bg);
    }
    #container {
        display: none;
    }
    #container-edit {
        display: none;
    }
</style>
<script>
    (async function init() {
        const response = await fetch('http://localhost:3000/get-profile');
        console.log("response", response);
        const user = await response.json();
        console.log(JSON.stringify(user));

        document.getElementById('name').textContent = user.name ? user.name : 'Anna Smith';
        document.getElementById('email').textContent = user.email ? user.email : 'anna.smith@example.com';
        document.getElementById('interests').textContent = user.interests ? user.interests : 'coding';

        const cont = document.getElementById('container');
        cont.style.display = 'block';
    })();

    async function handleUpdateProfileRequest() {
        const contEdit = document.getElementById('container-edit');
        const cont = document.getElementById('container');

        const payload = {
            name: document.getElementById('input-name').value,
            email: document.getElementById('input-email').value,
            interests: document.getElementById('input-interests').value
        };

        const response = await fetch('http://localhost:3000/update-profile', {
            method: "POST",
            headers: {
              'Accept': 'application/json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });
        const jsonResponse = await response.json();

        document.getElementById('name').textContent = jsonResponse.name;
        document.getElementById('email').textContent = jsonResponse.email;
        document.getElementById('interests').textContent = jsonResponse.interests;

        cont.style.display = 'block';
        contEdit.style.display = 'none';
    }

    function updateProfile() {
        const contEdit = document.getElementById('container-edit');
        const cont = document.getElementById('container');

        document.getElementById('input-name').value = document.getElementById('name').textContent;
        document.getElementById('input-email').value = document.getElementById('email').textContent;
        document.getElementById('input-interests').value = document.getElementById('interests').textContent;

        cont.style.display = 'none';
        contEdit.style.display = 'block';
    }

    function cancelUpdate() {
        document.getElementById('container-edit').style.display = 'none';
        document.getElementById('container').style.display = 'block';
    }
</script>
</head>
<body>
    <div class='container' id='container'>
        <div class='cover'></div>
        <div class='content'>
            <img src='profile-picture' alt="user-profile">
            <h1>User profile</h1>
            <div class='fields'>
                <div class='field'><span>Name</span><h3 id='name'>Anna Smith</h3></div>
                <div class='field'><span>Email</span><h3 id='email'>anna.smith@example.com</h3></div>
                <div class='field'><span>Interests</span><h3 id='interests'>coding</h3></div>
            </div>
            <div class='actions'>
                <button class='button' onclick="updateProfile()">Edit Profile</button>
            </div>
        </div>
    </div>
    <div class='container' id='container-edit'>
        <div class='cover'></div>
        <div class='content'>
            <img src='profile-picture' alt="user-profile">
            <h1>Edit profile</h1>
            <div class='fields'>
                <div class='field'><label for='input-name'>Name</label><input type="text" id='input-name' value='Anna Smith' /></div>
                <div class='field'><label for='input-email'>Email</label><input type="email" id='input-email' value='anna.smith@example.com' /></div>
                <div class='field'><label for='input-interests'>Interests</label><input type="text" id='input-interests' value='coding' /></div>
            </div>
            <div class='actions'>
                <button class='button secondary' onclick="cancelUpdate()">Cancel</button>
                <button class='button' onclick="handleUpdateProfileRequest()">Update Profile</button>
            </div>
        </div>
    </div>
</body>
</html>
